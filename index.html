<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Rama ❤️</title>

  <!-- خط احترافي -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      font-family:'Poppins', sans-serif;
      background:black;
    }

    /* الفيديو بالخلفية */
    video{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-2;
    }

    /* طبقة شفافة */
    .overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.45);
      z-index:-1;
    }

    /* المحتوى */
    .content{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      color:white;
      padding:20px;
    }

    h1{
      font-family:'Great Vibes', cursive;
      font-size:110px;
      font-weight:normal;
      color:#fff;
      text-shadow:
        0 0 10px #ff4d6d,
        0 0 20px #ff4d6d,
        0 0 40px #ff1e56;
      animation: glow 2s infinite alternate;
    }

    p{
      margin-top:20px;
      font-size:26px;
      font-weight:300;
      color:#ffe6eb;
      letter-spacing:2px;
    }

    @keyframes glow{
      from{
        text-shadow:
          0 0 10px #ff4d6d,
          0 0 20px #ff4d6d;
      }

      to{
        text-shadow:
          0 0 20px #ff1e56,
          0 0 40px #ff1e56,
          0 0 60px #ff4d6d;
      }
    }

    /* القلوب */
    .heart{
      position:absolute;
      bottom:-20px;
      color:#ff4d6d;
      animation: float linear forwards;
    }

    @keyframes float{
      0%{
        transform:translateY(0) scale(0);
        opacity:0;
      }

      20%{
        opacity:1;
      }

      100%{
        transform:translateY(-110vh) scale(1.5);
        opacity:0;
      }
    }

    /* للموبايل */
    @media(max-width:768px){
      h1{
        font-size:70px;
      }

      p{
        font-size:18px;
      }
    }

  </style>
</head>
<body>

  <!-- حط الفيديو هنا -->
  <video autoplay muted loop>
    <source src="looov.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="content">
    <h1>I Love You Rama ❤️</h1>
    <p>You are the most beautiful thing in my life ✨</p>
  </div>

  <script>

    function createHeart(){

      const heart = document.createElement("div");

      heart.classList.add("heart");

      heart.innerHTML = "❤";

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.fontSize = (Math.random() * 25 + 15) + "px";

      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 250);

  </script>

</body>
</html>
